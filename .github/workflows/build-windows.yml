name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2

      - name: Generate _version.py
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Set-Content -Path _version.py -Value "__version__ = `"$env:TAG`"" -Encoding utf8

      - name: Build exe
        run: pyinstaller --onefile --collect-all tkinterdnd2 --name "無音ノーツ自動置換ツール" replacement_tool.py

      - name: Copy readme
        shell: pwsh
        run: Copy-Item readme.txt dist/readme.txt

      - name: Create ZIP
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path "dist/無音ノーツ自動置換ツール.exe", "dist/readme.txt" -DestinationPath "dist/replacement_tool_$env:TAG.zip"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/replacement_tool_${{ github.ref_name }}.zip

      - name: Upload artifact (手動実行時)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: replacement_tool_${{ github.ref_name }}
          path: dist/replacement_tool_${{ github.ref_name }}.zip

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR の中間コミットまで含めてキャンセルすると「タグを打つ時点でその commit は
  # テスト済み」という前提が崩れるため、cancel は pull_request のときだけ行う。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      # --extra gui を付けない。テストは tkinter を必要としない。
      # --locked: uv.lock がずれていたら解決し直さず失敗させる（CI 再現性のため）。
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

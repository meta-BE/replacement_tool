name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      # --extra gui を付けない。テストは tkinter を必要としない。
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
